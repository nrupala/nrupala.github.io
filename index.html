<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub API Output</title>
    <style>
        body {
            font-family: monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            line-height: 1.5;
        }
        a {
            color: #58a6ff;
        }
        pre {
            background-color: #161b22;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <h2>GitHub API Endpoint</h2>
    <p>API Link: <a id="api-link" href="https://api.github.com/users/nrupala/repos?sort=updated&per_page=100" target="_blank">https://api.github.com/users/nrupala/repos?sort=updated&per_page=100</a></p>

    <h2>API Response</h2>
    <pre id="json-output">Fetching data...</pre>

    <script>
        const apiUrl = 'https://api.github.com/users/nrupala/repos?sort=updated&per_page=100';

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
                return response.json();
            })
            .then(data => {
                document.getElementById('json-output').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById('json-output').textContent = `Error fetching API data: ${error.message}`;
            });
    </script>

</body>
</html>
